<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC PRO</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
}

.hidden { display: none; }

.back-btn {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  padding: 10px;
}

button {
  margin: 5px;
  padding: 10px;
}

textarea {
  width: 100%;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>

<body>

<button class="back-btn" onclick="goBack()">⬅ Retour</button>

<h1>MC PRO</h1>

<section id="formSection">
  <h2>Informations Client</h2>

  <input type="text" id="nom" placeholder="Nom client"><br>
  <input type="date" id="date"><br>
  <input type="number" id="montant" placeholder="Montant"><br>

  <button onclick="saveClient()">Enregistrer</button>
  <button onclick="showSection('contratSection')">Aller au contrat</button>
</section>

<section id="contratSection" class="hidden">
  <h2>Contrat MC</h2>

  <textarea id="contratEditor" style="height:400px;">
CONTRAT DE PRESTATION
MAITRE DE CEREMONIE

Le présent contrat a pour objet de définir les termes et conditions dans lesquels le Prestataire s’engage à fournir au / à la Client(e) une prestation de services en qualité de Maître de cérémonie.

La prestation se déroulera le {{event_date}}, selon les modalités convenues entre les parties.

-----------------------------
CLIENT(E) : {{client_nom}}

Prestataire : Jean Jaurès NOGBOU

-----------------------------

Article 1 : Objet du contrat

1. Obligations du Prestataire
Le Prestataire s’engage à :
- Préparer et animer l’événement selon le programme validé
- Assurer la coordination des interventions
- Être présent à l’heure convenue

2. Obligations du Client
Le Client s’engage à :
- Fournir les informations nécessaires
- Mettre à disposition les moyens techniques
- Respecter les échéances de paiement

-----------------------------

Article 3 : Rémunération

Montant total : {{montant}} FCFA

Acompte (50%) : {{acompte}} FCFA
Solde : {{solde}} FCFA

-----------------------------

Article 4 : Conditions d’annulation

- Si le prestataire annule → remboursement intégral
- Si le client annule → acompte conservé

-----------------------------

Article 5 : Entrée en vigueur

Le contrat prend effet à sa signature

-----------------------------

Article 6 : Litiges

Les parties privilégient un règlement à l’amiable

-----------------------------

Fait le : {{date_signature}}

Signature Client :
Signature Prestataire :
</textarea>

  <button onclick="remplirContrat()">Auto-remplir</button>
  <button onclick="exportPDF()">Exporter PDF</button>
</section>

<script>
let historyStack = [];

function showSection(id) {
  document.querySelectorAll('section').forEach(sec => sec.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  historyStack.push(id);
}

function goBack() {
  historyStack.pop();
  const prev = historyStack[historyStack.length - 1] || 'formSection';
  showSection(prev);
}

function saveClient() {
  const data = {
    nom: document.getElementById('nom').value,
    date: document.getElementById('date').value,
    montant: document.getElementById('montant').value
  };

  localStorage.setItem('clientData', JSON.stringify(data));
}

function remplirContrat() {
  let contrat = document.getElementById("contratEditor").value;
  const data = JSON.parse(localStorage.getItem("clientData")) || {};

  contrat = contrat
    .replace("{{client_nom}}", data.nom || "")
    .replace("{{event_date}}", data.date || "")
    .replace("{{montant}}", data.montant || "")
    .replace("{{date_signature}}", new Date().toLocaleDateString());

  document.getElementById("contratEditor").value = contrat;
}

function exportPDF() {
  const data = JSON.parse(localStorage.getItem("clientData")) || {};

  const montant = Number(data.montant || 0);
  const acompte = montant * 0.5;
  const solde = montant * 0.5;

  const content = `
  <div style="font-family: Arial; padding:40px; line-height:1.6;">

    <h2 style="text-align:center;">CONTRAT DE PRESTATION</h2>
    <h3 style="text-align:center;">MAITRE DE CEREMONIE</h3>

    <p>Le présent contrat a pour objet de définir les termes et conditions dans lesquels le Prestataire s’engage à fournir au Client une prestation de Maître de cérémonie.</p>

    <p><strong>Client :</strong> ${data.nom || ''}</p>
    <p><strong>Date de l'événement :</strong> ${data.date || ''}</p>

    <h4>Article 1 : Objet du contrat</h4>
    <p><strong>Obligations du Prestataire :</strong><br>
    - Préparer et animer l’événement<br>
    - Assurer la coordination<br>
    - Être présent à l’heure</p>

    <p><strong>Obligations du Client :</strong><br>
    - Fournir les informations<br>
    - Mettre les moyens techniques<br>
    - Respecter les paiements</p>

    <h4>Article 3 : Rémunération</h4>
    <p>Montant total : ${montant} FCFA</p>
    <p>Acompte (50%) : ${acompte} FCFA</p>
    <p>Solde : ${solde} FCFA</p>

    <h4>Article 4 : Conditions d’annulation</h4>
    <p>Si le prestataire annule → remboursement intégral<br>
    Si le client annule → acompte conservé</p>

    <h4>Article 5 : Entrée en vigueur</h4>
    <p>Le contrat prend effet à sa signature</p>

    <h4>Article 6 : Litiges</h4>
    <p>Règlement à l’amiable privilégié</p>

    <br><br>

    <p>Fait le : ${new Date().toLocaleDateString()}</p>

    <br><br>

    <table style="width:100%; margin-top:40px;">
      <tr>
        <td>Signature Client :</td>
        <td>Signature Prestataire :</td>
      </tr>
    </table>

  </div>
  `;

  html2pdf()
    .from(content)
    .set({
      margin: 10,
      filename: 'contrat_mc.pdf',
      html2canvas: { scale: 2 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    })
    .save();
}

// Auto save form
const inputs = document.querySelectorAll("input");
inputs.forEach(input => {
  input.addEventListener("input", () => {
    saveClient();
  });
});

// Restore data
window.onload = function() {
  const data = JSON.parse(localStorage.getItem("clientData"));
  if (data) {
    document.getElementById('nom').value = data.nom || '';
    document.getElementById('date').value = data.date || '';
    document.getElementById('montant').value = data.montant || '';
  }
};

</script>

</body>
</html>
