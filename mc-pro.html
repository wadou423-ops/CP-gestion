<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC PRO</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 20px;
}

.hidden { display: none; }

.back-btn {
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 999;
  padding: 10px;
}

button {
  margin: 5px;
  padding: 10px;
}

textarea {
  width: 100%;
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>

<body>

<button class="back-btn" onclick="goBack()">⬅ Retour</button>

<h1>MC PRO</h1>

<section id="formSection">
  <h2>Informations Client</h2>

  <input type="text" id="nom" placeholder="Nom client"><br>
  <input type="date" id="date"><br>
  <input type="number" id="montant" placeholder="Montant"><br>

  <button onclick="saveClient()">Enregistrer</button>
  <button onclick="showSection('contratSection')">Aller au contrat</button>
</section>

<section id="contratSection" class="hidden">
  <h2>Contrat MC</h2>

  <textarea id="contratEditor" style="height:400px;">
CONTRAT DE PRESTATION - MAITRE DE CEREMONIE

Client : {{client_nom}}
Date de l'événement : {{event_date}}

Le prestataire s'engage à assurer la prestation avec professionnalisme.

Montant total : {{montant}} FCFA

Fait le : {{date_signature}}

Signature Client :
Signature Prestataire :
  </textarea>

  <button onclick="remplirContrat()">Auto-remplir</button>
  <button onclick="exportPDF()">Exporter PDF</button>
</section>

<script>
let historyStack = [];

function showSection(id) {
  document.querySelectorAll('section').forEach(sec => sec.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  historyStack.push(id);
}

function goBack() {
  historyStack.pop();
  const prev = historyStack[historyStack.length - 1] || 'formSection';
  showSection(prev);
}

function saveClient() {
  const data = {
    nom: document.getElementById('nom').value,
    date: document.getElementById('date').value,
    montant: document.getElementById('montant').value
  };

  localStorage.setItem('clientData', JSON.stringify(data));
}

function remplirContrat() {
  let contrat = document.getElementById("contratEditor").value;
  const data = JSON.parse(localStorage.getItem("clientData")) || {};

  contrat = contrat
    .replace("{{client_nom}}", data.nom || "")
    .replace("{{event_date}}", data.date || "")
    .replace("{{montant}}", data.montant || "")
    .replace("{{date_signature}}", new Date().toLocaleDateString());

  document.getElementById("contratEditor").value = contrat;
}

function exportPDF() {
  const element = document.createElement("div");
  element.innerText = document.getElementById("contratEditor").value;

  html2pdf().from(element).save("contrat_mc.pdf");
}

// Auto save form
const inputs = document.querySelectorAll("input");
inputs.forEach(input => {
  input.addEventListener("input", () => {
    saveClient();
  });
});

// Restore data
window.onload = function() {
  const data = JSON.parse(localStorage.getItem("clientData"));
  if (data) {
    document.getElementById('nom').value = data.nom || '';
    document.getElementById('date').value = data.date || '';
    document.getElementById('montant').value = data.montant || '';
  }
};

</script>

</body>
</html>
