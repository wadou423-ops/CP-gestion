<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRM Pro - Dashboard</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root{
      --bg:#0b0f17;
      --panel:#121826;
      --card:#151c2e;
      --text:#e9ecf5;
      --muted:#9aa4b2;
      --accent:#4f8cff;
      --border:rgba(255,255,255,0.06);
      --radius:16px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter, sans-serif;
    }

    body{
      background:var(--bg);
      color:var(--text);
      display:flex;
      min-height:100vh;
    }

    /* SIDEBAR */
    .sidebar{
      width:270px;
      background:var(--panel);
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:25px;
      border-right:1px solid var(--border);
    }

    .logo{
      font-size:18px;
      font-weight:700;
      letter-spacing:0.5px;
    }

    .nav a{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border-radius:12px;
      text-decoration:none;
      color:var(--muted);
      transition:0.2s;
      font-size:14px;
    }

    .nav a:hover{
      background:var(--card);
      color:var(--text);
    }

    .nav a.active{
      background:rgba(79,140,255,0.12);
      color:var(--accent);
    }

    /* MAIN */
    .main{
      flex:1;
      padding:25px;
    }

    /* TOPBAR */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .search{
      width:320px;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--text);
      outline:none;
    }

    .user{
      font-size:14px;
      color:var(--muted);
    }

    /* CARDS */
    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
    }

    .card{
      background:var(--panel);
      padding:18px;
      border-radius:var(--radius);
      border:1px solid var(--border);
      transition:0.2s;
    }

    .card:hover{
      transform:translateY(-3px);
      background:var(--card);
    }

    .card h4{
      font-size:13px;
      color:var(--muted);
      font-weight:500;
    }

    .card p{
      font-size:22px;
      margin-top:10px;
      font-weight:600;
    }

    /* TABLE */
    .table-container{
      margin-top:25px;
      background:var(--panel);
      border-radius:var(--radius);
      border:1px solid var(--border);
      overflow:hidden;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      padding:14px;
      text-align:left;
      font-size:14px;
    }

    th{
      color:var(--text);
      background:rgba(255,255,255,0.02);
    }

    td{
      color:var(--muted);
      border-top:1px solid var(--border);
    }

    .status{
      padding:6px 10px;
      border-radius:10px;
      font-size:12px;
      display:inline-block;
    }

    .active{
      background:rgba(34,197,94,0.12);
      color:#22c55e;
    }

    .inactive{
      background:rgba(255,255,255,0.06);
      color:var(--muted);
    }

    /* RESPONSIVE */
    @media(max-width:1000px){
      .grid{
        grid-template-columns:repeat(2,1fr);
      }

      .sidebar{
        display:none;
      }

      .search{
        width:200px;
      }
    }

    @media(max-width:600px){
      .grid{
        grid-template-columns:1fr;
      }
    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">CRM PRO</div>

    <div class="nav">
      <a class="active" href="#"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
      <a href="#"><i class="fa-solid fa-users"></i> Clients</a>
      <a href="#"><i class="fa-solid fa-box"></i> Produits</a>
      <a href="#"><i class="fa-solid fa-chart-line"></i> Stats</a>
      <a href="#"><i class="fa-solid fa-gear"></i> Paramètres</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <input class="search" placeholder="Rechercher un client, produit..."/>
      <div class="user">👤 Admin</div>
    </div>

    <!-- CARDS -->
    <div class="grid">
      <div class="card">
        <h4>Clients</h4>
        <p>1,240</p>
      </div>

      <div class="card">
        <h4>Ventes</h4>
        <p>8,560</p>
      </div>

      <div class="card">
        <h4>Revenus</h4>
        <p>12.5M</p>
      </div>

      <div class="card">
        <h4>Croissance</h4>
        <p>+18%</p>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Statut</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Client Alpha</td>
            <td>[email protected]</td>
            <td><span class="status active">Actif</span></td>
          </tr>

          <tr>
            <td>Client Beta</td>
            <td>[email protected]</td>
            <td><span class="status inactive">Inactif</span></td>
          </tr>

          <tr>
            <td>Client Gamma</td>
            <td>[email protected]</td>
            <td><span class="status active">Actif</span></td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</body>
</html>
