<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CRM Gestion</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    :root{
      --bg:#0f1115;
      --card:#151924;
      --soft:#1c2230;
      --text:#e8eaf0;
      --muted:#9aa3b2;
      --accent:#4f8cff; /* tu peux garder TA couleur ici */
      --radius:16px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter, sans-serif;
    }

    body{
      background:var(--bg);
      color:var(--text);
      display:flex;
      min-height:100vh;
    }

    /* SIDEBAR */
    .sidebar{
      width:260px;
      background:var(--card);
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:20px;
      border-right:1px solid rgba(255,255,255,0.05);
    }

    .logo{
      font-size:18px;
      font-weight:600;
      color:var(--text);
    }

    .menu a{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
      border-radius:12px;
      color:var(--muted);
      text-decoration:none;
      transition:0.2s;
    }

    .menu a:hover{
      background:var(--soft);
      color:var(--text);
    }

    .menu a.active{
      background:rgba(79,140,255,0.15);
      color:var(--accent);
    }

    /* MAIN */
    .main{
      flex:1;
      padding:25px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    .search{
      background:var(--card);
      padding:10px 15px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.05);
      width:300px;
      color:var(--text);
    }

    /* CARDS */
    .grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .card{
      background:var(--card);
      padding:20px;
      border-radius:var(--radius);
      border:1px solid rgba(255,255,255,0.05);
      transition:0.2s;
    }

    .card:hover{
      transform:translateY(-3px);
      background:#1a2030;
    }

    .card h3{
      font-size:14px;
      color:var(--muted);
    }

    .card p{
      font-size:22px;
      margin-top:10px;
      font-weight:600;
    }

    /* TABLE */
    .table{
      margin-top:25px;
      background:var(--card);
      border-radius:var(--radius);
      padding:15px;
      border:1px solid rgba(255,255,255,0.05);
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      padding:12px;
      text-align:left;
      color:var(--muted);
      font-size:14px;
    }

    th{
      color:var(--text);
      border-bottom:1px solid rgba(255,255,255,0.05);
    }

    /* RESPONSIVE */
    @media(max-width:1000px){
      .grid{
        grid-template-columns:repeat(2,1fr);
      }

      .sidebar{
        display:none;
      }
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="logo">CRM Pro</div>

    <div class="menu">
      <a href="#" class="active"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
      <a href="#"><i class="fa-solid fa-users"></i> Clients</a>
      <a href="#"><i class="fa-solid fa-box"></i> Produits</a>
      <a href="#"><i class="fa-solid fa-chart-line"></i> Statistiques</a>
      <a href="#"><i class="fa-solid fa-gear"></i> Paramètres</a>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div class="topbar">
      <input class="search" placeholder="Rechercher..."/>
      <div>👤 Admin</div>
    </div>

    <!-- CARDS -->
    <div class="grid">
      <div class="card">
        <h3>Clients</h3>
        <p>1,240</p>
      </div>

      <div class="card">
        <h3>Ventes</h3>
        <p>8,560</p>
      </div>

      <div class="card">
        <h3>Revenus</h3>
        <p>12.5M</p>
      </div>

      <div class="card">
        <h3>Taux</h3>
        <p>+18%</p>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table">
      <table>
        <thead>
          <tr>
            <th>Nom</th>
            <th>Email</th>
            <th>Statut</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td>Client 1</td>
            <td>[email protected]</td>
            <td>Actif</td>
          </tr>

          <tr>
            <td>Client 2</td>
            <td>[email protected]</td>
            <td>Inactif</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

</body>
</html>
